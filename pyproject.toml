[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "Toaster"
version = "0.0.1"
authors = [
	{ name="Stefan Kleemann", email="stefan.kleemann@hhu.de"},]

description = "A small package to generate Toasts to  welcome freshmen at College."
readme = "README.md"
requires-python = ">=3.14"
clasifiers = [
	"Programming Langugage :: Python :: 3",
	"Operating System :: Linux",
	]
licence = "MIT"
licence-files = ["LICENSE"]

[project.urls]
Homepage = ""
Issues = ""
